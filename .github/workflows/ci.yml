name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/make_dataset.py --out data/customers.csv
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m churn_ml.train --data data/customers.csv --model artifacts/churn.joblib
        env:
          PYTHONPATH: src
